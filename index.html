<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Go" />
  <meta name="theme-color" content="#121212" />
  <title>碁 Go Board Game</title>
  <meta name="description" content="Premium offline Go board game with GNU Go AI. Works on any device." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
<div id="app">

  <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
  <header id="topbar">
    <span id="app-logo">碁</span>
    <div id="turn-indicator">
      <div id="turn-stone"></div>
      <span id="turn-text">Black's turn</span>
    </div>
    <div id="move-badge">M <strong>0</strong></div>
    <button id="btn-scan" title="Scan physical board" aria-label="Scan board">📷</button>
    <button id="btn-settings" title="Settings" aria-label="Open settings">⚙</button>
  </header>

  <!-- ── Board ──────────────────────────────────────────────────────────── -->
  <main id="board-wrap">
    <canvas id="board-canvas" aria-label="Go board"></canvas>
  </main>

  <!-- ── Bottom action bar ─────────────────────────────────────────────── -->
  <footer id="action-bar">
    <div id="captures">
      <div class="cap-item">
        <span class="cap-dot black"></span>
        <span class="cap-count" id="cap-black">0</span>
      </div>
      <div class="cap-item">
        <span class="cap-dot white"></span>
        <span class="cap-count" id="cap-white">0</span>
      </div>
    </div>
    <div id="action-btns">
      <button id="btn-pass"      class="action-btn"           title="Pass your turn">Pass</button>
      <button id="btn-undo"      class="action-btn secondary" title="Undo last move">↩</button>
      <button id="btn-territory" class="action-btn secondary hidden" title="Toggle territory map">Territory</button>
      <button id="btn-resign"    class="action-btn danger"    title="Resign the game">Resign</button>
      <button id="btn-new"       class="action-btn secondary" title="New game">New</button>
    </div>
  </footer>

</div>

<!-- ── Settings sheet backdrop ──────────────────────────────────────────── -->
<div id="settings-backdrop"></div>

<!-- ── Scan sheet backdrop ───────────────────────────────────────────────── -->
<div id="scan-backdrop"></div>

<!-- ── Settings sheet ───────────────────────────────────────────────────── -->
<div id="settings-sheet" role="dialog" aria-label="Game settings">
  <div id="sheet-handle"></div>

  <!-- Mode -->
  <div class="sheet-section">
    <div class="sheet-label">Mode</div>
    <div class="pill-row">
      <button id="btn-mode-pvp"  class="sheet-pill active" title="Pass &amp; Play">Pass &amp; Play</button>
      <button id="btn-mode-pvai" class="sheet-pill"        title="Play vs GNU Go AI">vs AI (GNU Go)</button>
    </div>
  </div>

  <!-- Board size -->
  <div class="sheet-section">
    <div class="sheet-label">Board Size</div>
    <div class="pill-row">
      <button class="sheet-pill size-pill" data-size="9"  id="btn-size-9">9×9</button>
      <button class="sheet-pill size-pill" data-size="13" id="btn-size-13">13×13</button>
      <button class="sheet-pill size-pill active" data-size="19" id="btn-size-19">19×19</button>
    </div>
  </div>

  <!-- AI config — shown only when vs AI mode is active -->
  <div id="sheet-ai-section">
    <div class="sheet-section">
      <div class="sheet-label">Play As</div>
      <div class="pill-row">
        <button id="btn-playas-black" class="sheet-pill active" title="Play as Black">● Black</button>
        <button id="btn-playas-white" class="sheet-pill"        title="Play as White">○ White</button>
      </div>
    </div>
    <div class="sheet-section">
      <div class="sheet-label">Difficulty</div>
      <div class="pill-row">
        <button id="btn-diff-easy"     class="sheet-pill"        title="Easy — GNU Go level 1">Easy</button>
        <button id="btn-diff-standard" class="sheet-pill active" title="Standard — GNU Go level 5">Standard</button>
        <button id="btn-diff-hard"     class="sheet-pill"        title="Hard — GNU Go level 10">Hard</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Scan sheet ────────────────────────────────────────────────────────── -->
<div id="scan-sheet" role="dialog" aria-label="Scan physical Go board">
  <div id="scan-sheet-handle"></div>

  <!-- Photo preview area -->
  <div class="sheet-section">
    <div class="sheet-label">Scan Physical Board</div>
    <div id="scan-preview-wrap">
      <img id="scan-preview-img" alt="Board photo" />
      <div id="scan-placeholder">
        <span id="scan-placeholder-icon">📷</span>
        <span>No photo selected</span>
      </div>
    </div>
  </div>

  <!-- Hidden file input -->
  <input id="scan-file-input" type="file" accept="image/*" capture="environment" />

  <!-- API key -->
  <div class="sheet-section">
    <div class="sheet-label">Gemini API Key</div>
    <input id="scan-apikey-input" type="password"
           placeholder="Paste your API key…"
           autocomplete="off" spellcheck="false" />
    <p id="scan-apikey-hint">Stored locally on your device only.</p>
  </div>

  <!-- Buttons -->
  <div id="scan-step-main">
    <div class="pill-row">
      <button id="btn-scan-pick" class="sheet-pill active">📷 Take / Choose Photo</button>
    </div>
    <div class="pill-row" style="margin-top:8px">
      <button id="btn-scan-analyze" class="sheet-pill hidden">✨ Analyze Board</button>
    </div>
    <p id="scan-status-msg"></p>
  </div>

  <!-- Loading state -->
  <div id="scan-step-loading" class="hidden">
    <div id="scan-spinner"></div>
    <p id="scan-loading-msg">Analyzing board…</p>
  </div>
</div>

<!-- ── Status toast ──────────────────────────────────────────────────────── -->
<div id="status-toast" role="status" aria-live="polite"></div>

<!-- ── Game-over modal ────────────────────────────────────────────────────── -->
<div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div id="modal-box">
    <h2 id="modal-title">Game Over</h2>
    <p id="modal-body"></p>
    <div id="modal-score-details"></div>
    <div id="modal-actions">
      <button id="modal-territory-btn" class="action-btn secondary hidden">Territory</button>
      <button id="modal-new-btn" class="action-btn">New Game</button>
    </div>
  </div>
</div>

<!-- ── Scan confirm modal ─────────────────────────────────────────────────── -->
<div id="scan-confirm-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="scan-confirm-title">
  <div id="scan-confirm-box">
    <div id="scan-confirm-icon">✓</div>
    <h2 id="scan-confirm-title">Board Scanned!</h2>
    <p id="scan-detected-count"></p>

    <!-- Next player -->
    <div class="scan-confirm-section">
      <div class="sheet-label">Who plays next?</div>
      <div class="pill-row">
        <button id="scan-confirm-black" class="sheet-pill active">● Black</button>
        <button id="scan-confirm-white" class="sheet-pill">○ White</button>
      </div>
    </div>

    <!-- Captured stones -->
    <div class="scan-confirm-section">
      <div class="sheet-label">Captured stones</div>
      <div id="scan-captures-row">
        <div class="scan-cap-item">
          <span class="cap-dot black"></span>
          <span class="scan-cap-label">Black:</span>
          <input id="scan-confirm-cap-b" class="scan-cap-input" type="number"
                 min="0" max="361" value="0" inputmode="numeric" />
        </div>
        <div class="scan-cap-item">
          <span class="cap-dot white"></span>
          <span class="scan-cap-label">White:</span>
          <input id="scan-confirm-cap-w" class="scan-cap-input" type="number"
                 min="0" max="361" value="0" inputmode="numeric" />
        </div>
      </div>
    </div>

    <div id="scan-confirm-actions">
      <button id="scan-confirm-apply" class="action-btn">Apply to Board</button>
      <button id="scan-confirm-retake" class="action-btn secondary">Retake</button>
    </div>
  </div>
</div>

<script src="src/rules.js"></script>
<script src="src/gnugo.js"></script>
<script src="src/scan.js"></script>
<script src="src/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(console.warn);
    });
  }
</script>
</body>
</html>
